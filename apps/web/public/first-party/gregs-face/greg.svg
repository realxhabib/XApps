<svg xmlns="http://www.w3.org/2000/svg" width="400" height="380" viewBox="0 0 400 380">
  <!-- Greg (stand-in): an original cartoon, not a photo of anyone. Feature rects live in src/first-party/gregs-face/face.ts. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#94a3b0" />
      <stop offset="0.6" stop-color="#7b8a98" />
      <stop offset="1" stop-color="#5f6d7a" />
    </radialGradient>
    <radialGradient id="mottleLight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b3c0ca" stop-opacity="0.55" />
      <stop offset="1" stop-color="#b3c0ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mottleDark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55626f" stop-opacity="0.5" />
      <stop offset="1" stop-color="#55626f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="skin" cx="48%" cy="45%" r="62%">
      <stop offset="0" stop-color="#f9dcc9" />
      <stop offset="0.7" stop-color="#f4cfb8" />
      <stop offset="1" stop-color="#e9b99f" />
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f09e98" stop-opacity="0.45" />
      <stop offset="1" stop-color="#f09e98" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4743a" />
      <stop offset="0.55" stop-color="#bb5a24" />
      <stop offset="1" stop-color="#96421a" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a66" />
      <stop offset="1" stop-color="#26324a" />
    </linearGradient>
    <clipPath id="eyeL"><ellipse cx="163" cy="198" rx="19" ry="11" /></clipPath>
    <clipPath id="eyeR"><ellipse cx="237" cy="198" rx="19" ry="11" /></clipPath>
  </defs>

  <!-- Mottled studio backdrop -->
  <rect width="400" height="380" fill="url(#bg)" />
  <circle cx="70" cy="80" r="90" fill="url(#mottleLight)" />
  <circle cx="330" cy="60" r="70" fill="url(#mottleDark)" />
  <circle cx="350" cy="230" r="100" fill="url(#mottleLight)" />
  <circle cx="40" cy="260" r="80" fill="url(#mottleDark)" />
  <circle cx="220" cy="20" r="60" fill="url(#mottleLight)" />
  <circle cx="300" cy="330" r="70" fill="url(#mottleDark)" />

  <!-- Shoulders + neck -->
  <path d="M30 380 C42 338 104 314 160 308 L240 308 C296 314 358 338 370 380 Z" fill="url(#shirt)" />
  <path d="M168 262 L168 318 C184 334 216 334 232 318 L232 262 Z" fill="#e7b69c" />
  <path d="M160 309 C176 336 224 336 240 309 C224 322 176 322 160 309 Z" fill="#dca88e" />

  <!-- Ears -->
  <ellipse cx="114" cy="206" rx="15" ry="25" fill="#efc4aa" />
  <ellipse cx="116" cy="207" rx="7" ry="14" fill="#e1a78d" />
  <ellipse cx="286" cy="206" rx="15" ry="25" fill="#efc4aa" />
  <ellipse cx="284" cy="207" rx="7" ry="14" fill="#e1a78d" />

  <!-- Face -->
  <path d="M116 160 C114 104 286 104 284 160 L283 222 C280 282 244 318 200 318 C156 318 120 282 117 222 Z" fill="url(#skin)" />
  <ellipse cx="148" cy="246" rx="22" ry="15" fill="url(#blush)" />
  <ellipse cx="252" cy="246" rx="22" ry="15" fill="url(#blush)" />
  <g fill="#d38b66" opacity="0.55">
    <circle cx="146" cy="232" r="1.6" /><circle cx="155" cy="238" r="1.3" /><circle cx="140" cy="240" r="1.2" />
    <circle cx="160" cy="228" r="1.1" /><circle cx="150" cy="226" r="1" />
    <circle cx="254" cy="232" r="1.6" /><circle cx="245" cy="238" r="1.3" /><circle cx="260" cy="240" r="1.2" />
    <circle cx="240" cy="228" r="1.1" /><circle cx="250" cy="226" r="1" />
  </g>
  <path d="M170 312 C186 320 214 320 230 312" stroke="#e3ae94" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Hair: copper, side-parted on his right -->
  <path
    d="M112 190 C100 130 118 72 190 58 C258 48 306 84 294 150 C292 166 290 178 286 192 C282 160 276 138 262 128 C238 112 190 124 156 106 C140 124 126 150 120 190 Z"
    fill="url(#hair)"
  />
  <path d="M152 106 C158 88 170 74 188 64" stroke="#8a3b15" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M168 98 C200 84 248 86 276 112" stroke="#e38c4f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
  <path d="M176 110 C206 100 240 104 262 120" stroke="#e38c4f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5" />
  <path d="M128 120 C132 100 146 84 164 76" stroke="#e38c4f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5" />
  <path d="M200 70 C232 66 268 78 286 104" stroke="#f0a064" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55" />

  <!-- Eyebrows -->
  <path d="M142 170 Q162 160 184 167" stroke="#a24e1d" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M216 167 Q238 160 258 170" stroke="#a24e1d" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- Eyes (blue-grey) -->
  <g>
    <ellipse cx="163" cy="198" rx="19" ry="11" fill="#fbfaf6" />
    <g clip-path="url(#eyeL)">
      <circle cx="164" cy="199" r="8.5" fill="#6f8898" stroke="#4b5f6d" stroke-width="1.6" />
      <circle cx="164" cy="199" r="4" fill="#1b2129" />
      <circle cx="167" cy="196" r="2" fill="#ffffff" />
      <path d="M143 190 L184 190 L184 194 Q163 187 143 194 Z" fill="#f1c9b1" />
    </g>
    <path d="M143 197 Q163 184 184 196" stroke="#6b3d2a" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <path d="M148 204 Q163 211 179 204" stroke="#d9a58c" stroke-width="1.2" fill="none" stroke-linecap="round" />

    <ellipse cx="237" cy="198" rx="19" ry="11" fill="#fbfaf6" />
    <g clip-path="url(#eyeR)">
      <circle cx="238" cy="199" r="8.5" fill="#6f8898" stroke="#4b5f6d" stroke-width="1.6" />
      <circle cx="238" cy="199" r="4" fill="#1b2129" />
      <circle cx="241" cy="196" r="2" fill="#ffffff" />
      <path d="M216 190 L257 190 L257 194 Q237 187 216 194 Z" fill="#f1c9b1" />
    </g>
    <path d="M216 196 Q237 184 257 197" stroke="#6b3d2a" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <path d="M221 204 Q237 211 252 204" stroke="#d9a58c" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Nose -->
  <g>
    <path d="M195 224 C193 236 189 246 186 252" stroke="#e0a78c" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M208 228 C212 238 215 245 215 251" stroke="#e6b199" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7" />
    <ellipse cx="200" cy="249" rx="7" ry="5" fill="#fde5d6" opacity="0.8" />
    <path d="M185 254 C190 262 210 262 215 254" stroke="#d4967c" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <ellipse cx="192" cy="257" rx="3.2" ry="1.9" fill="#c4846b" />
    <ellipse cx="208" cy="257" rx="3.2" ry="1.9" fill="#c4846b" />
  </g>

  <!-- Mouth: slightly pursed -->
  <g>
    <path d="M179 284 Q177 287 179 291" stroke="#e1a88f" stroke-width="1.4" fill="none" stroke-linecap="round" />
    <path d="M221 284 Q223 287 221 291" stroke="#e1a88f" stroke-width="1.4" fill="none" stroke-linecap="round" />
    <path d="M182 287 C188 280 195 281 200 284 C205 281 212 280 218 287 C210 289 190 289 182 287 Z" fill="#c46e67" />
    <path d="M183 288 C190 298 210 298 217 288 C208 290 192 290 183 288 Z" fill="#d3827a" />
    <path d="M182 287.5 Q200 291 218 287.5" stroke="#8f4a45" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <ellipse cx="200" cy="293.5" rx="6" ry="1.6" fill="#efb3aa" />
  </g>
</svg>
